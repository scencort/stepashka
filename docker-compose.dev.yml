services:
  frontend:
    build:
      context: ./frontend
    container_name: gradus-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-python

  backend-python:
    build:
      context: ./backend
    container_name: gradus-backend-python
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gradus
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: gradus-postgres
    environment:
      POSTGRES_DB: gradus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - gradus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gradus"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: gradus-redis
    ports:
      - "6379:6379"
    volumes:
      - gradus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  gradus_pg_data:
  gradus_redis_data:
