<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Запись экрана Gradus</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #0f172a; color: white; gap: 20px; }
  h2 { margin: 0; font-size: 24px; }
  p { margin: 0; color: #94a3b8; font-size: 14px; text-align: center; max-width: 500px; }
  button { padding: 16px 40px; font-size: 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
  #startBtn { background: #DC2626; color: white; }
  #startBtn:hover { background: #b91c1c; }
  #stopBtn { background: #16a34a; color: white; display: none; }
  #status { font-size: 16px; color: #fbbf24; }
</style>
</head>
<body>
<h2>🎥 Запись экрана Gradus</h2>
<p>Нажми "Начать запись", выбери вкладку <strong>localhost:5173</strong> в диалоге браузера и нажми "Поделиться". Запись идёт 10 секунд автоматически.</p>
<div id="status">Готов к записи</div>
<button id="startBtn" onclick="startRecording()">▶ Начать запись</button>
<button id="stopBtn" onclick="stopRecording()">⏹ Остановить</button>
<script>
let recorder, stream;
const chunks = { hero: [], globe: [] };

async function startRecording() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: 2560, height: 1440, frameRate: 30 },
      audio: false
    });
    document.getElementById('status').textContent = '🔴 Идёт запись...';
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';

    const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm; codecs=vp9';
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 15_000_000 });
    const allChunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) allChunks.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(allChunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gradus_recording.${ext}`;
      a.click();
      document.getElementById('status').textContent = `✅ Готово! Файл скачан (${Math.round(blob.size/1024)}KB)`;
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('startBtn').textContent = '▶ Записать ещё раз';
    };

    recorder.start(200);
  } catch (e) {
    document.getElementById('status').textContent = '❌ Ошибка: ' + e.message;
  }
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
</script>
</body>
</html>
