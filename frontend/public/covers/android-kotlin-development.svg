<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7C1D1D"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="480" cy="270" r="220" fill="white" opacity="0.06"/>
  <circle cx="480" cy="270" r="160" fill="white" opacity="0.04"/>
  <!-- Android robot -->
  <g transform="translate(410, 145)" fill="white" opacity="0.9">
    <!-- Head -->
    <path d="M20 80 Q20 20 70 20 Q120 20 120 80 Z"/>
    <!-- Eyes -->
    <circle cx="50" cy="55" r="7" fill="#DC2626"/><circle cx="90" cy="55" r="7" fill="#DC2626"/>
    <!-- Antennae -->
    <line x1="45" y1="20" x2="30" y2="-5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="95" y1="20" x2="110" y2="-5" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="20" y="90" width="100" height="100" rx="10"/>
    <!-- Arms -->
    <rect x="-10" y="95" width="22" height="70" rx="11" opacity="0.8"/>
    <rect x="128" y="95" width="22" height="70" rx="11" opacity="0.8"/>
    <!-- Legs -->
    <rect x="38" y="195" width="22" height="55" rx="11" opacity="0.8"/>
    <rect x="80" y="195" width="22" height="55" rx="11" opacity="0.8"/>
  </g>
</svg>
