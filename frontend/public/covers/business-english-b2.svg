      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7C1D1D"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="480" cy="270" r="220" fill="white" opacity="0.06"/>
  <circle cx="480" cy="270" r="160" fill="white" opacity="0.04"/>
