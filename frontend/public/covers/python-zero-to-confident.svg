<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7C1D1D"/>
    </linearGradient>
    <linearGradient id="step" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="py" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE6E6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Decorative glow halos -->
  <circle cx="760" cy="120" r="240" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="760" cy="120" r="150" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="160" cy="470" r="160" fill="#FFFFFF" opacity="0.04"/>

  <!-- Soft diagonal light band -->
  <g opacity="0.08">
    <rect x="-100" y="350" width="1200" height="60" fill="#FFFFFF" transform="rotate(-14 480 270)"/>
  </g>

  <!-- Rising steps: 0 → confident (metaphor for zero to pro) -->
  <g transform="translate(120, 410)">
    <!-- Base line -->
    <rect x="-20" y="0" width="720" height="3" rx="1.5" fill="#FFFFFF" opacity="0.35"/>

    <!-- Step 1 -->
    <rect x="20"  y="-50"  width="110" height="50" rx="10" fill="url(#step)" opacity="0.55"/>
    <!-- Step 2 -->
    <rect x="150" y="-100" width="110" height="100" rx="10" fill="url(#step)" opacity="0.70"/>
    <!-- Step 3 -->
    <rect x="280" y="-160" width="110" height="160" rx="10" fill="url(#step)" opacity="0.85"/>
    <!-- Step 4 — "confident" peak -->
    <rect x="410" y="-230" width="110" height="230" rx="10" fill="#FFFFFF"/>

    <!-- Arrow rising across the steps -->
    <path d="M40 -10 L180 -70 L310 -120 L440 -180 L560 -240"
          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
          fill="none" opacity="0.95"/>
    <!-- Arrow head -->
    <path d="M560 -240 L540 -228 L554 -212 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Starting dot at "zero" -->
    <circle cx="40" cy="-10" r="7" fill="#FFFFFF"/>
    <circle cx="40" cy="-10" r="3" fill="#DC2626"/>
  </g>

  <!-- Python logo, large, left-top area -->
  <g transform="translate(120, 120) scale(1.35)" opacity="0.98">
    <!-- Upper body (blue in original, white here to match palette) -->
    <path fill="url(#py)" d="M80 0C48 0 40 16 40 32v24h40v8H24C8 64 0 80 0 112s8 48 24 48h16v-24c0-16 8-32 24-32h48c16 0 24-8 24-24V32C136 16 128 0 112 0H80z"/>
    <!-- Lower body -->
    <path fill="url(#py)" opacity="0.78" d="M80 200c32 0 40-16 40-32v-24h-40v-8h56c16 0 24-16 24-48s-8-48-24-48H120v24c0 16-8 32-24 32H48c-16 0-24 8-24 24v40c0 16 8 32 24 32h32z"/>
    <!-- Eyes -->
    <circle cx="64" cy="24"  r="7" fill="#DC2626"/>
    <circle cx="96" cy="176" r="7" fill="#7C1D1D"/>
  </g>

  <!-- Confidence spark on top step -->
  <g transform="translate(655, 150)" opacity="0.95">
    <path d="M0 -36 L8 -10 L34 -2 L10 6 L2 32 L-6 6 L-32 -2 L-8 -10 Z" fill="#FFFFFF"/>
    <circle r="3" fill="#DC2626"/>
  </g>

  <!-- Tiny code dots for tech feel -->
  <g fill="#FFFFFF" opacity="0.25">
    <circle cx="820" cy="430" r="4"/>
    <circle cx="840" cy="430" r="4"/>
    <circle cx="860" cy="430" r="4"/>
    <circle cx="820" cy="450" r="4"/>
    <circle cx="840" cy="450" r="4"/>
    <circle cx="880" cy="450" r="4"/>
    <circle cx="820" cy="470" r="4"/>
    <circle cx="860" cy="470" r="4"/>
    <circle cx="880" cy="470" r="4"/>
  </g>
</svg>
