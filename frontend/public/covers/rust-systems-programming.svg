<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7C1D1D"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="480" cy="270" r="220" fill="white" opacity="0.06"/>
  <circle cx="480" cy="270" r="160" fill="white" opacity="0.04"/>
  <!-- Rust gear logo -->
  <g transform="translate(480, 270)" fill="white" opacity="0.9">
    <!-- Outer gear teeth -->
    <g>
      <rect x="-8" y="-110" width="16" height="25" rx="3"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(30)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(60)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(90)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(120)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(150)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(180)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(210)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(240)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(270)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(300)"/>
      <rect x="-8" y="-110" width="16" height="25" rx="3" transform="rotate(330)"/>
    </g>
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="white" stroke-width="8"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="5"/>
    <!-- R letter -->
    <text x="0" y="18" font-family="Arial, sans-serif" font-size="55" font-weight="bold" text-anchor="middle" fill="white">R</text>
  </g>
</svg>
