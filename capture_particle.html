<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; overflow: hidden; width: 1200px; height: 700px; }
canvas { display: block; width: 1200px; height: 700px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const W = 1200, H = 700;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

const color = '#DC2626';
const particleCount = 110;
const maxLinkDistance = 140;
const cursorRadius = 160;
const intensity = 1;

const withAlpha = (hex, a) => {
  const aa = Math.max(0, Math.min(255, Math.round(a * 255))).toString(16).padStart(2, '0');
  return hex + aa;
};

const particles = [];
for (let i = 0; i < particleCount; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.45,
    vy: (Math.random() - 0.5) * 0.45,
    r: 1 + Math.random() * 1.4,
  });
}

const cursor = { x: W / 2, y: H / 2, active: true };

let last = performance.now();
function draw(now) {
  const dt = Math.min(50, now - last);
  last = now;
  const dtScale = dt / 16.67;
  ctx.clearRect(0, 0, W, H);

  for (const p of particles) {
    if (cursor.active) {
      const dx = p.x - cursor.x;
      const dy = p.y - cursor.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < cursorRadius * cursorRadius && d2 > 0.5) {
        const d = Math.sqrt(d2);
        const f = (1 - d / cursorRadius) * 0.55;
        p.vx += (dx / d) * f;
        p.vy += (dy / d) * f;
      }
    }
    p.vx = p.vx * 0.96 + (Math.random() - 0.5) * 0.04;
    p.vy = p.vy * 0.96 + (Math.random() - 0.5) * 0.04;
    const speed = Math.hypot(p.vx, p.vy);
    const maxV = 1.3;
    if (speed > maxV) { p.vx = (p.vx / speed) * maxV; p.vy = (p.vy / speed) * maxV; }
    p.x += p.vx * dtScale;
    p.y += p.vy * dtScale;
    if (p.x < 0) { p.x = 0; p.vx *= -1; }
    else if (p.x > W) { p.x = W; p.vx *= -1; }
    if (p.y < 0) { p.y = 0; p.vy *= -1; }
    else if (p.y > H) { p.y = H; p.vy *= -1; }
  }

  ctx.lineWidth = 1;
  const linkSq = maxLinkDistance * maxLinkDistance;
  for (let i = 0; i < particles.length; i++) {
    const a = particles[i];
    for (let j = i + 1; j < particles.length; j++) {
      const b = particles[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < linkSq) {
        const d = Math.sqrt(d2);
        const alpha = (1 - d / maxLinkDistance) * 0.38 * intensity;
        ctx.strokeStyle = withAlpha(color, alpha);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }

  if (cursor.active) {
    const cursorSq = cursorRadius * cursorRadius;
    for (const p of particles) {
      const dx = p.x - cursor.x, dy = p.y - cursor.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < cursorSq) {
        const d = Math.sqrt(d2);
        const alpha = (1 - d / cursorRadius) * 0.7 * intensity;
        ctx.strokeStyle = withAlpha(color, alpha);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(cursor.x, cursor.y); ctx.stroke();
      }
    }
    const halo = ctx.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, cursorRadius * 0.9);
    halo.addColorStop(0, withAlpha(color, 0.18));
    halo.addColorStop(1, withAlpha(color, 0));
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(cursor.x, cursor.y, cursorRadius * 0.9, 0, Math.PI * 2); ctx.fill();
  }

  for (const p of particles) {
    ctx.fillStyle = withAlpha(color, 0.9);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
